name: Sync to Second Repository

on:
  push:
    branches: [ main ]

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Main Repo
        uses: actions/checkout@v3

      - name: Push to Second Repo
        uses: cpina/github-action-push-to-another-repo@main
        env:
          API_TOKEN_GITHUB: ${{ secrets.ACTION_TOKEN }}
        with:
          source-directory: '.'
          destination-github-username: 'colawellness-riyadh'
          destination-repository-name: 'hotcola.net'
          user-email: 'kikoverendia@gmail.com'
          commit-message: 'Auto-sync from main repository'
          target-branch: main
